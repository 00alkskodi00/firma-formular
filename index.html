<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Potvrdenie požiadaviek</title>
<style>
  :root { --p: #2e73bf; --ok: #2e7d32; --warn: #e65100; --bg: #f4f6f9; --card: #fff; --text: #1f2933; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: 14px; }
  .firma { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .firma b { color: var(--text); font-size: 15px; }
  .item-head { display: flex; gap: 12px; align-items: flex-start; }
  .item-head .txt { flex: 1; }
  .item-img { max-width: 160px; max-height: 120px; border-radius: 8px; object-fit: contain; cursor: zoom-in; }
  .req { color: var(--warn); }
  .opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #d5dbe3; border-radius: 10px; margin-top: 8px; cursor: pointer; }
  .opt:hover { border-color: var(--p); }
  .opt input { width: 20px; height: 20px; flex: none; }
  .opt img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex: none; }
  .opt.sel { border-color: var(--ok); background: #eef8ef; }
  textarea, input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #d5dbe3; border-radius: 10px; font: inherit; margin-top: 8px; }
  textarea { min-height: 70px; resize: vertical; }
  label.small { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .btn { display: inline-block; border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--ok); color: #fff; width: 100%; font-size: 17px; padding: 14px; }
  .btn.ghost { background: #eef2f7; color: var(--text); }
  .btn:disabled { opacity: .6; cursor: default; }
  .sig { border: 1px solid #9aa5b1; border-radius: 10px; background: #fff; touch-action: none; width: 100%; height: 180px; display: block; }
  .err { color: #b00020; font-size: 14px; margin-top: 8px; }
  .status { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .status.ok { background: #e6f4ea; color: #1b5e20; }
  .status.warn { background: #fff3e0; color: #e65100; }
  .center { text-align: center; padding: 40px 16px; }
  .big { font-size: 48px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay img { max-width: 100%; max-height: 100%; }
  .overlay.show { display: flex; }
  .done-item { padding: 8px 0; border-bottom: 1px solid #eef0f3; font-size: 14px; }
  .done-item b { display: block; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card center"><div class="muted">Načítavam formulár…</div></div>
</div>
<div class="overlay" id="overlay" onclick="this.classList.remove('show')"><img id="overlayImg" alt=""></div>
<script>
(function () {
  var API = 'https://ctkzzqlnoyvmnkqnnnxf.supabase.co/functions/v1/online-formular';
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  var app = document.getElementById('app');
  var form = null;
  var odpovede = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // Len čisté base64 – hodnota zo snímky ide do atribútu (ochrana pred XSS).
  function img(b64, cls) { if (!b64 || !/^[A-Za-z0-9+\/=\s]+$/.test(b64)) return ''; return '<img class="' + esc(cls) + '" src="data:image/*;base64,' + b64.replace(/\s/g, '') + '" alt="" onclick="showImg(this.src)">'; }
  window.showImg = function (src) { document.getElementById('overlayImg').src = src; document.getElementById('overlay').classList.add('show'); };

  function showError(title, text) {
    app.innerHTML = '<div class="card center"><div class="big">⚠️</div><h2>' + esc(title) + '</h2><div class="muted">' + esc(text) + '</div></div>';
  }

  function firmaHtml(f) {
    if (!f || !(f.nazov || f.adresa || f.telefon || f.email || f.www)) return '';
    var parts = [];
    if (f.nazov) parts.push('<b>' + esc(f.nazov) + '</b>');
    if (f.adresa) parts.push(esc(f.adresa));
    var ids = [];
    if (f.ico) ids.push('IČO: ' + esc(f.ico));
    if (f.dic) ids.push('DIČ: ' + esc(f.dic));
    if (f.icDph) ids.push('IČ DPH: ' + esc(f.icDph));
    if (ids.length) parts.push(ids.join(' • '));
    var k = [];
    if (f.telefon) k.push('<a href="tel:' + esc(f.telefon.replace(/\s+/g, '')) + '">' + esc(f.telefon) + '</a>');
    if (f.email) k.push('<a href="mailto:' + esc(f.email) + '">' + esc(f.email) + '</a>');
    if (f.www) k.push('<a href="' + esc(/^https?:\/\//i.test(f.www) ? f.www : 'https://' + f.www) + '" target="_blank" rel="noopener">' + esc(f.www) + '</a>');
    if (k.length) parts.push(k.join(' • '));
    var s = [];
    if (f.facebook) s.push('<a href="' + esc(/^https?:\/\//i.test(f.facebook) ? f.facebook : 'https://facebook.com/' + f.facebook.replace(/^@/, '')) + '" target="_blank" rel="noopener">Facebook</a>');
    if (f.instagram) s.push('<a href="' + esc(/^https?:\/\//i.test(f.instagram) ? f.instagram : 'https://instagram.com/' + f.instagram.replace(/^@/, '')) + '" target="_blank" rel="noopener">Instagram</a>');
    if (s.length) parts.push(s.join(' • '));
    return '<div class="firma">' + parts.join('<br>') + '</div><hr style="border:0;border-top:1px solid #eef0f3;margin:10px 0">';
  }

  function odp(id) { if (!odpovede[id]) odpovede[id] = { vybrane: [], text: '', anoNie: null, poznamka: '' }; return odpovede[id]; }

  function renderDone(meno, dna) {
    var html = '<div class="card center"><div class="big">✅</div><h2>Ďakujeme, požiadavky sú potvrdené</h2>';
    if (meno) html += '<div class="muted">Potvrdil(a): ' + esc(meno) + (dna ? ', ' + esc(new Date(dna).toLocaleString('sk-SK')) : '') + '</div>';
    html += '<div class="muted" style="margin-top:8px">Firma dostala vaše odpovede automaticky. Túto stránku môžete zavrieť.</div></div>';
    html += '<div class="card"><h2>Zhrnutie</h2>';
    (form.polozky || []).forEach(function (p) {
      var o = odpovede[p.id] || {};
      var val = '';
      if (p.typ === 'vyber' || p.typ === 'viacVyber') {
        val = (p.moznosti || []).filter(function (m) { return (o.vybrane || []).indexOf(m.id) >= 0; }).map(function (m) { return esc(m.nazov); }).join(', ');
      } else if (p.typ === 'anoNie') {
        val = o.anoNie === true ? 'Áno' : (o.anoNie === false ? 'Nie' : '');
      } else {
        val = esc(o.text || '');
      }
      html += '<div class="done-item"><b>' + esc(p.nazov) + '</b>' + (val || '<span class="muted">–</span>') + (o.poznamka ? '<div class="muted">Poznámka: ' + esc(o.poznamka) + '</div>' : '') + '</div>';
    });
    html += '</div>';
    app.innerHTML = html;
  }

  function render() {
    var f = form;
    var html = '<div class="card">' + firmaHtml(f.firma) + '<h1>Potvrdenie požiadaviek</h1><div class="muted">' + esc(f.nazov || '') + '</div>';
    var z = f.zakazka || {};
    var zk = f.zakaznik || {};
    if (z.kod || z.nazov) html += '<div class="muted" style="margin-top:6px">Zákazka: ' + esc([z.kod, z.nazov].filter(Boolean).join(' – ')) + '</div>';
    if (zk.meno) html += '<div class="muted">Zákazník: ' + esc(zk.meno) + '</div>';
    html += '<div class="muted" style="margin-top:10px">Prosíme, označte zvolené možnosti, doplňte texty, podpíšte sa a stlačte „Potvrdiť“. Položky označené <span class="req">*</span> sú povinné.</div></div>';

    (f.polozky || []).forEach(function (p, i) {
      var o = odp(p.id);
      html += '<div class="card" id="item-' + i + '"><div class="item-head"><div class="txt"><h2>' + (i + 1) + '. ' + esc(p.nazov) + (p.povinne ? ' <span class="req">*</span>' : '') + '</h2>';
      if (p.popis) html += '<div class="muted">' + esc(p.popis) + '</div>';
      html += '</div>' + img(p.obrazok, 'item-img') + '</div>';
      if (p.typ === 'vyber' || p.typ === 'viacVyber') {
        var type = p.typ === 'vyber' ? 'radio' : 'checkbox';
        (p.moznosti || []).forEach(function (m) {
          var checked = o.vybrane.indexOf(m.id) >= 0;
          html += '<label class="opt' + (checked ? ' sel' : '') + '"><input type="' + type + '" name="p' + i + '" value="' + esc(m.id) + '"' + (checked ? ' checked' : '') + ' data-p="' + esc(p.id) + '" data-m="' + esc(m.id) + '" data-t="' + esc(p.typ) + '">' + img(m.obrazok, '') + '<span>' + esc(m.nazov) + '</span></label>';
        });
        html += '<div class="muted" style="margin-top:6px;font-size:12px">' + (p.typ === 'vyber' ? 'Vyberte jednu možnosť.' : 'Môžete vybrať viac možností.') + '</div>';
      } else if (p.typ === 'anoNie') {
        html += '<label class="opt' + (o.anoNie === true ? ' sel' : '') + '"><input type="radio" name="p' + i + '" value="ano"' + (o.anoNie === true ? ' checked' : '') + ' data-p="' + esc(p.id) + '" data-t="ano"><span>Áno</span></label>';
        html += '<label class="opt' + (o.anoNie === false ? ' sel' : '') + '"><input type="radio" name="p' + i + '" value="nie"' + (o.anoNie === false ? ' checked' : '') + ' data-p="' + esc(p.id) + '" data-t="nie"><span>Nie</span></label>';
      } else {
        html += '<textarea data-p="' + esc(p.id) + '" data-t="text" placeholder="Vaša odpoveď">' + esc(o.text) + '</textarea>';
      }
      if (p.poznamkaPovolena !== false) {
        html += '<label class="small">Poznámka (nepovinné)</label><input type="text" data-p="' + esc(p.id) + '" data-t="pozn" value="' + esc(o.poznamka) + '" placeholder="Napr. požiadavka, ktorú chcete doplniť">';
      }
      html += '<div class="err" id="err-' + i + '"></div></div>';
    });

    html += '<div class="card"><h2>Potvrdenie</h2><div class="muted">Potvrdzujem, že uvedené požiadavky a výbery sú správne a záväzné pre výrobu.</div>';
    html += '<label class="small">Vaše meno a priezvisko <span class="req">*</span></label><input type="text" id="meno" value="' + esc(zk.meno || '') + '" placeholder="Meno a priezvisko">';
    html += '<label class="small">Podpis prstom alebo myšou <span class="req">*</span></label><canvas class="sig" id="sig"></canvas>';
    html += '<div style="margin-top:8px"><button class="btn ghost" type="button" id="clearSig">Vymazať podpis</button></div>';
    html += '<div class="err" id="err-final"></div>';
    html += '<div style="margin-top:14px"><button class="btn primary" type="button" id="submit">Potvrdiť</button></div></div>';
    app.innerHTML = html;

    app.addEventListener('change', function (e) {
      var t = e.target;
      if (!t || !t.dataset || !t.dataset.p) return;
      var o = odp(t.dataset.p);
      if (t.dataset.t === 'vyber') { o.vybrane = [t.dataset.m]; }
      else if (t.dataset.t === 'viacVyber') { if (t.checked) { if (o.vybrane.indexOf(t.dataset.m) < 0) o.vybrane.push(t.dataset.m); } else { o.vybrane = o.vybrane.filter(function (x) { return x !== t.dataset.m; }); } }
      else if (t.dataset.t === 'ano') { o.anoNie = true; }
      else if (t.dataset.t === 'nie') { o.anoNie = false; }
      var grp = t.name ? app.querySelectorAll('input[name="' + t.name + '"]') : [t];
      Array.prototype.forEach.call(grp, function (inp) { inp.parentNode.classList.toggle('sel', inp.checked); });
    });
    app.addEventListener('input', function (e) {
      var t = e.target;
      if (!t || !t.dataset || !t.dataset.p) return;
      var o = odp(t.dataset.p);
      if (t.dataset.t === 'text') o.text = t.value;
      if (t.dataset.t === 'pozn') o.poznamka = t.value;
    });
    setupSignature();
    document.getElementById('submit').addEventListener('click', submit);
  }

  var sigCanvas, sigCtx, drawing = false, hasSig = false, last = null;
  function setupSignature() {
    sigCanvas = document.getElementById('sig');
    var ratio = window.devicePixelRatio || 1;
    var w = sigCanvas.clientWidth, h = sigCanvas.clientHeight;
    sigCanvas.width = Math.round(w * ratio); sigCanvas.height = Math.round(h * ratio);
    sigCtx = sigCanvas.getContext('2d');
    sigCtx.scale(ratio, ratio);
    sigCtx.lineWidth = 2.5; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round'; sigCtx.strokeStyle = '#111';
    sigCtx.fillStyle = '#fff'; sigCtx.fillRect(0, 0, w, h);
    sigCtx.strokeStyle = '#d5dbe3'; sigCtx.beginPath(); sigCtx.moveTo(16, h - 36); sigCtx.lineTo(w - 16, h - 36); sigCtx.stroke();
    sigCtx.strokeStyle = '#111';
    function pos(e) { var r = sigCanvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    sigCanvas.addEventListener('pointerdown', function (e) { e.preventDefault(); drawing = true; last = pos(e); sigCanvas.setPointerCapture(e.pointerId); });
    sigCanvas.addEventListener('pointermove', function (e) { if (!drawing) return; e.preventDefault(); var p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(last.x, last.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); last = p; hasSig = true; });
    function up(e) { drawing = false; }
    sigCanvas.addEventListener('pointerup', up); sigCanvas.addEventListener('pointercancel', up); sigCanvas.addEventListener('pointerleave', up);
    document.getElementById('clearSig').addEventListener('click', function () { hasSig = false; setupSignature(); });
  }

  function validate() {
    var ok = true;
    (form.polozky || []).forEach(function (p, i) {
      var o = odp(p.id), missing = false;
      if (p.povinne) {
        if (p.typ === 'vyber' || p.typ === 'viacVyber') missing = o.vybrane.length === 0;
        else if (p.typ === 'anoNie') missing = o.anoNie === null;
        else missing = !o.text.trim();
      }
      var el = document.getElementById('err-' + i);
      el.textContent = missing ? 'Táto položka je povinná.' : '';
      if (missing && ok) { ok = false; document.getElementById('item-' + i).scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
    var fin = document.getElementById('err-final');
    var meno = document.getElementById('meno').value.trim();
    if (!meno) { fin.textContent = 'Zadajte, prosím, svoje meno.'; return false; }
    if (!hasSig) { fin.textContent = 'Podpíšte sa, prosím, do rámčeka.'; return false; }
    fin.textContent = '';
    return ok;
  }

  function submit() {
    if (!validate()) return;
    var btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = 'Odosielam…';
    var podpis = sigCanvas.toDataURL('image/png').split(',')[1];
    var meno = document.getElementById('meno').value.trim();
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, odpovede: odpovede, podpis: podpis, meno: meno }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { throw new Error(res.j && res.j.error ? res.j.error : 'Odoslanie zlyhalo'); }
        renderDone(meno, new Date().toISOString());
        window.scrollTo(0, 0);
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = 'Potvrdiť';
        document.getElementById('err-final').textContent = 'Nepodarilo sa odoslať: ' + e.message + '. Skúste to, prosím, znova.';
      });
  }

  if (!token) { showError('Chýba odkaz', 'Otvorte, prosím, odkaz, ktorý ste dostali od firmy.'); return; }
  fetch(API + '?api=1&t=' + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
    .then(function (res) {
      if (!res.ok) {
        if (res.status === 410) showError('Platnosť odkazu vypršala', 'Požiadajte firmu o nový odkaz.');
        else showError('Formulár sa nenašiel', (res.j && res.j.error) || 'Skontrolujte, prosím, odkaz.');
        return;
      }
      form = res.j.form || {};
      odpovede = res.j.odpovede || form.odpovede || {};
      Object.keys(odpovede).forEach(function (k) { var o = odpovede[k]; o.vybrane = o.vybrane || []; o.text = o.text || ''; o.poznamka = o.poznamka || ''; if (o.anoNie === undefined) o.anoNie = null; });
      if (res.j.stav === 'potvrdene') { renderDone(res.j.meno, res.j.potvrdene_dna); return; }
      render();
    })
    .catch(function () { showError('Stránka sa nedá načítať', 'Skontrolujte pripojenie na internet a skúste znova.'); });
})();
</script>
</body>
</html>
