<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Odkaz už neplatí</title>
<style>
  :root { --bg: #f4f6f9; --card: #fff; --text: #1f2933; --muted: #6b7280; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; margin-top: 40px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.5; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Odkaz už neplatí</h1>
    <p>Tento odkaz je neaktívny. Kontaktujte firmu, ktorá vám ho poslala.</p>
  </div>
</div>
</body>
</html>
